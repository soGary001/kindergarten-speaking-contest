name: Build Android APK

# 手动触发，或推送 v* 标签时构建。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor deps
        run: npm install

      # 把阿里云 Key 注入前端（仅本次构建的工作副本，不提交）。APK 内嵌，前端不暴露给页面源码。
      - name: Inject Aliyun key
        shell: bash
        env:
          ALIYUN_API_KEY: ${{ secrets.ALIYUN_API_KEY }}
        run: printf 'window.ALIYUN_ASR_KEY = "%s";\n' "$ALIYUN_API_KEY" > frontend/js/android-config.js

      - name: Add Android platform
        run: npx cap add android

      - name: Add microphone permission to manifest
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perm = ('    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
                  '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n')
          if "RECORD_AUDIO" not in s:
              s = s.replace("<application", perm + "\n    <application", 1)
          open(p, "w").write(s)
          print(s)
          PY

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SpeakingStar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeakingStar-Android
          path: SpeakingStar.apk
          retention-days: 30

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SpeakingStar.apk
