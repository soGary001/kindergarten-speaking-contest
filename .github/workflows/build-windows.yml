name: Build Windows EXE

# 手动触发（Actions 页面点 Run），或推送 v* 标签时自动构建并发布 Release。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # config_local.py 不在仓库里（含密钥）。从 GitHub Secrets 生成，构建后随二进制编入，不进日志。
      - name: Create config_local.py from secrets
        shell: bash
        env:
          ALIYUN_API_KEY: ${{ secrets.ALIYUN_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
        run: |
          printf 'API_KEY = "%s"\nALIYUN_API_KEY = "%s"\n' "$MIMO_API_KEY" "$ALIYUN_API_KEY" > backend/config_local.py

      - name: Run tests
        run: pytest -q

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name "SpeakingStar"
          --add-data "frontend;frontend"
          --hidden-import backend.config_local
          run.py

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path dist/SpeakingStar/* -DestinationPath SpeakingStar-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeakingStar-Windows
          path: SpeakingStar-Windows.zip
          retention-days: 30

      # 仅当推送的是 v* 标签时，把 zip 作为 Release 附件发布（生成可直接下载的链接）。
      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SpeakingStar-Windows.zip
